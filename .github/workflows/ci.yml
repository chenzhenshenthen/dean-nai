name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: deanai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deanai/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:automatic
      - run: node --test scripts/test-library-controls.mjs
      - run: npm run build:desktop

  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nai-artist-library
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nai-artist-library/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: desktop_launcher
